<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Login - Sistema de Facturación CFE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="login-page">

    <div class="card shadow-sm login-card">
        <div class="card-header bg-success text-white text-center">
            <div class="d-flex flex-column align-items-center gap-2">
                <div class="image-slot image-slot-logo">
                    LOGO
                </div>
                <div>
                    <h1 class="h6 mb-0">Sistema de Facturación Eléctrica</h1>
                    <p class="small mb-0">Acceso a Lecturistas</p>
                </div>
            </div>
        </div>
        <div class="card-body">
            <form class="row gy-3">
                <div class="col-12">
                    <label for="usuario" class="form-label small fw-semibold">
                        Usuario
                    </label>
                    <input type="text" id="usuario" class="form-control form-control-sm"
                        placeholder="Ingrese su usuario">
                </div>
                <div class="col-12">
                    <label for="password" class="form-label small fw-semibold">
                        Contraseña
                    </label>
                    <input type="password" id="password" class="form-control form-control-sm" placeholder="••••••••">
                </div>
                <!--<div class="col-12">
                     <label for="rol" class="form-label small fw-semibold">
                        Rol
                    </label>
                    <select id="rol" class="form-select form-select-sm">
                        <option value="lecturista" selected>Lecturista</option>
                        <option value="administrativo">Administrativo</option>
                    </select> 
                </div>-->
                <div class="col-12 d-grid mt-2">
                    <a href="./src/captura-lectura.html" class="btn btn-success btn-sm">
                        Iniciar sesión
                    </a>
                </div>
            </form>
        </div>
        <div class="card-footer text-center small text-muted">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>

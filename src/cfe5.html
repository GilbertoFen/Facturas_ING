<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFE - Ayuda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .bg-cfe-green {
            background-color: #6a966a; /* Verde del banner superior/footer */
        }
        .text-cfe-green {
            color: #1a6032; /* Verde más oscuro para el logo/texto */
        }
        .main-content {
            /* Un gris muy claro para el fondo principal */
            background-color: #f7f7f7; 
            min-height: 70vh; /* Asegura que la sección principal sea alta */
        }
        .help-question {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer; /* Indica que son elementos clicables */
            transition: color 0.2s;
        }
        .help-question:hover {
            color: #1a6032; /* Cambia de color al pasar el mouse */
        }
    </style>
</head>
<body>

    <header class="container-fluid py-3 border-bottom">
        <div class="d-flex justify-content-between align-items-center container">
            <div class="h2 mb-0 text-cfe-green">
                <span class="fw-bold">CFE</span>
            </div>
            <nav class="d-flex align-items-center">
                <a href="#" class="text-decoration-none text-dark me-3">Sucursales</a>
                <a href="#" class="text-decoration-none text-dark me-3">Ayuda</a>
                <a href="#" class="btn btn-dark btn-sm">Ingresar</a>
            </nav>
        </div>
    </header>

    <div class="container-fluid bg-cfe-green py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="text-white fw-bold">Preguntas Frecuentes</span>
            <nav>
                <a href="#" class="text-white text-decoration-none me-3">Facebook</a>
                <a href="#" class="text-white text-decoration-none me-3">YouTube</a>
                <a href="#" class="text-white text-decoration-none me-3">Instagram</a>
                <a href="#" class="text-white text-decoration-none">TikTok</a>
            </nav>
        </div>
    </div>

    <main class="container-fluid main-content">
        <div class="container py-5">
            <h1 class="mb-5 text-dark fw-bold">¿Necesitas ayuda?</h1>
            
            <ul class="list-unstyled">
                <li class="help-question fw-normal">¿Cómo pago mi servicio?</li>
                <li class="help-question fw-normal">¿Cómo sé cuánto debo pagar?</li>
                <li class="help-question fw-normal">¿Cómo veo mi historial de consumo?</li>
                <li class="help-question fw-normal">¿En dónde puedo pagar mi servicio?</li>
            </ul>
            
            <div style="height: 300px;"></div>

        </div>
    </main>

    <footer class="container-fluid bg-cfe-green py-3">
        <div class="container text-center text-white">
            <p class="mb-0">Derechos Reservados © Términos y Condiciones</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
